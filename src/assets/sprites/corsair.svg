<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <linearGradient id="cs-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4252"></stop>
      <stop offset="0.5" stop-color="#2b2733"></stop>
      <stop offset="1" stop-color="#16131c"></stop>
    </linearGradient>
    <linearGradient id="cs-sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332d3e"></stop>
      <stop offset="1" stop-color="#120f18"></stop>
    </linearGradient>
    <radialGradient id="cs-eng" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.3" style="stop-color:var(--accent,#ff5555)"></stop>
      <stop offset="1" style="stop-color:var(--accent,#ff5555)" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <!-- косые рваные крылья-паруса -->
  <polygon points="28,30 6,52 12,60 28,48" fill="url(#cs-sail)" stroke="#0a0810" stroke-width="1"></polygon>
  <polygon points="36,30 58,52 52,60 36,48" fill="url(#cs-sail)" stroke="#0a0810" stroke-width="1"></polygon>
  <polygon points="26,38 12,52 15,55 26,46" style="fill:var(--accent,#ff5555)" opacity="0.65"></polygon>
  <polygon points="38,38 52,52 49,55 38,46" style="fill:var(--accent,#ff5555)" opacity="0.65"></polygon>
  <!-- зазубрины на парусах -->
  <polygon points="10,55 14,53 13,58" fill="#0a0810"></polygon>
  <polygon points="54,55 50,53 51,58" fill="#0a0810"></polygon>

  <!-- хищный узкий корпус с раздвоенным тараном -->
  <polygon points="32,2 36,10 35,16 38,24 39,44 37,66 34,80 30,80 27,66 25,44 26,24 29,16 28,10" fill="url(#cs-hull)" stroke="#0a0810" stroke-width="1.2"></polygon>
  <polygon points="32,2 35,9 32,13 29,9" style="fill:var(--accent,#ff5555)" opacity="0.95"></polygon>
  <!-- таран-клыки -->
  <polygon points="27,8 24,18 27,16" fill="#3a3344" stroke="#0a0810" stroke-width="0.8"></polygon>
  <polygon points="37,8 40,18 37,16" fill="#3a3344" stroke="#0a0810" stroke-width="0.8"></polygon>

  <!-- рубка-прищур -->
  <polygon points="32,22 35,27 35,34 29,34 29,27" fill="#0d0a14" stroke="#0a0810" stroke-width="0.8"></polygon>
  <polygon points="30,26 34,26 33.4,29 30.6,29" style="fill:var(--accent,#ff5555)" opacity="0.85"></polygon>

  <!-- трюм для добычи с люком-меткой -->
  <rect x="28" y="40" width="8" height="18" fill="#0c0a12" stroke="#2e2837" stroke-width="0.9"></rect>
  <line x1="28.8" y1="41" x2="35.2" y2="57" style="stroke:var(--accent,#ff5555)" stroke-width="1" opacity="0.7"></line>
  <line x1="35.2" y1="41" x2="28.8" y2="57" style="stroke:var(--accent,#ff5555)" stroke-width="1" opacity="0.7"></line>

  <!-- кормовые шипы -->
  <polygon points="27,62 22,72 26,70" fill="#222a3a" stroke="#0a0810" stroke-width="0.8"></polygon>
  <polygon points="37,62 42,72 38,70" fill="#222a3a" stroke="#0a0810" stroke-width="0.8"></polygon>

  <rect x="29" y="79" width="6" height="4" fill="#0d0a12"></rect>
  <ellipse cx="32" cy="86" rx="4.2" ry="7.5" fill="url(#cs-eng)"></ellipse>
</svg>
